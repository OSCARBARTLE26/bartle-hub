<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bartle Home</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home">
<meta name="theme-color" content="#4C7A66">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
/* Light and calm, by choice: soft sage on near-white, rounded cards, plenty of air.
   Everything she taps sits at the top. One page per part of her week. */
:root{
  --bg:#F3F6F3; --card:#FFFFFF; --line:#DDE5DF; --ink:#25302A; --muted:#6B7870;
  --sage:#4C7A66; --sage-soft:#DCE9E2; --peach:#C9764B; --peach-soft:#F7E6DC; --crit:#B3473A;
  --display:"Newsreader", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
[hidden]{display:none !important}

#top{background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand b{font-family:var(--display);font-weight:500;font-size:24px;line-height:1.1}
.gear{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600}
#ask-form{display:flex;gap:8px}
#ask-form input{flex:1;min-width:0}
nav ul{list-style:none;margin:0;padding:0;display:flex;overflow-x:auto}
nav li{flex:1}
nav a{display:block;text-align:center;white-space:nowrap;padding:10px 8px 11px;text-decoration:none;color:var(--muted);font-size:15px;font-weight:600;border-bottom:3px solid transparent}
nav a[aria-current="page"]{color:var(--sage);border-bottom-color:var(--sage)}

#view{flex:1;overflow-y:auto;padding:20px 16px 36px}
.col{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.pad{padding:16px}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sage)}
h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.08;margin:4px 0 0;text-wrap:balance}
h2{font-size:16px;font-weight:700;margin:0;text-wrap:balance}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.note{color:var(--muted);font-size:14px;margin:0}
.link{color:var(--sage);background:none;border:0;padding:4px 0;font-weight:600;font-size:14px;text-decoration:none}

.figs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fig{padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fig b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.fig span{color:var(--muted);font-size:13px}
.fig.warm{background:var(--peach-soft);border-color:var(--peach-soft)} .fig.warm b{color:var(--peach)}

.dots{display:flex;justify-content:space-between;gap:6px}
.dotday{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.dotday i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:block}
.dotday.done i{background:var(--sage);border-color:var(--sage)}
.dotday.today{color:var(--ink)} .dotday.today i{border-color:var(--sage)}
.track{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.track i{display:block;height:100%;background:var(--sage);border-radius:5px}
.cols{display:flex;align-items:flex-end;gap:8px;height:150px}
.colbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.colbar b{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.colbar .bar{width:100%;max-width:34px;border-radius:6px 6px 0 0;background:var(--sage-soft)}
.colbar .bar.hit{background:var(--sage)}
.colbar em{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap}
.key{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.key span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--sage)}
.key span.u::before{background:var(--sage-soft)}
.quick-row{display:flex;gap:8px;flex-wrap:wrap}
.slot{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:0;padding-top:4px}
.slot-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.slot-head b{font-weight:700;font-size:17px}
.slot-head .t{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;margin-right:6px}
.names{display:flex;gap:8px;flex-wrap:wrap}
.big .chip{padding:14px 22px;font-size:18px;min-width:96px}
.big .slot-head b{font-size:21px}
.slots-grid{display:grid;grid-template-columns:1fr;gap:12px}
.slot-card{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.slot-card.is-done{background:var(--sage-soft);border-color:var(--sage-soft)}
.slot-card.is-due{border-color:var(--peach);box-shadow:0 0 0 2px var(--peach-soft)}
.dog-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.dog-hero .next{font-family:var(--display);font-size:22px}
.clock{font-family:var(--display);font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.people{display:grid;grid-template-columns:1fr;gap:10px}
.person{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.person-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.person-top b{font-size:19px;font-weight:700}
.big .person .chip,.person .chip{padding:9px 16px;font-size:16px;min-width:0}
.person .names{flex-wrap:nowrap}
.person .sub{color:var(--muted);font-size:15px;margin:0}
.person.out{border-left:5px solid var(--peach)} .person.home{border-left:5px solid var(--sage)}
.day-h{margin:6px 0 0;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day-h.is-today{color:var(--sage)}
.ev-time{font-variant-numeric:tabular-nums;color:var(--sage);font-weight:700;margin-right:6px}
@media (min-width:700px){ .people{grid-template-columns:1fr 1fr} }
.kiosk #top{display:none}
.kiosk #view{padding-top:22px}
.hub-grid{display:grid;grid-template-columns:1fr;gap:18px}
.hub .slots-grid{grid-template-columns:1fr}
.hub .meal{grid-template-columns:110px 1fr}
.pin{font-size:28px;letter-spacing:.5em;text-align:center;font-variant-numeric:tabular-nums}
.exit{align-self:center;background:none;border:0;color:var(--muted);font-size:13px;font-weight:600;padding:10px}
@media (min-width:700px){ .hub .slots-grid{grid-template-columns:1fr 1fr} }
@media (min-width:1000px){ .hub-grid{grid-template-columns:1.15fr 1fr;align-items:start} .hub .slots-grid{grid-template-columns:1fr} }
.pill.late{background:#F6DCD8;color:var(--crit)}
.feed{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.feed:first-of-type{border-top:0}
.feed b{font-weight:600}
.feed .who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.feed .chip{padding:7px 14px;font-size:14px}
.chip{border:1px solid var(--sage);color:var(--sage);background:var(--card);border-radius:99px;padding:9px 16px;font-weight:600;font-size:15px}
.chip:hover{background:var(--sage-soft)}

.list{display:flex;flex-direction:column;overflow:hidden}
.row{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:13px 16px;display:flex;flex-direction:column;gap:2px}
.row-main:hover{background:var(--bg)}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-sub{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.row-side{display:flex;align-items:center;gap:6px;padding:10px 14px 10px 0;flex-shrink:0}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.sage{background:var(--sage-soft);color:var(--sage)} .pill.peach{background:var(--peach-soft);color:var(--peach)}
.empty{padding:16px;color:var(--muted);font-size:15px}
.tick{display:flex;align-items:center;gap:12px;padding:6px 8px 6px 16px;border-top:1px solid var(--line)}
.tick:first-child{border-top:0}
.tick label{flex:1;display:flex;align-items:center;gap:12px;padding:8px 0;min-width:0;overflow-wrap:anywhere}
.tick input{width:22px;height:22px;accent-color:var(--sage);flex-shrink:0}
.tick.done span{text-decoration:line-through;color:var(--muted)}
.x{background:none;border:0;color:var(--muted);font-size:14px;font-weight:600;padding:8px 10px}
.meal{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:10px}
.meal label{font-weight:600;font-size:14px}
.meal.today label{color:var(--sage)}

.btn{border-radius:99px;padding:11px 18px;font-weight:600;border:1px solid var(--line);background:var(--card)}
.btn.primary{background:var(--sage);color:#fff;border-color:var(--sage)}
.btn.ghost{background:none}
.btn.danger{color:var(--crit);border-color:var(--crit);background:none}
.btn.add{align-self:flex-start}
.btn[disabled]{opacity:.5;cursor:default}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 15px;font-weight:600;font-size:14px;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--sage);color:#fff;border-color:var(--sage)}
.quick{display:flex;gap:8px}
.quick input{flex:1;min-width:0}
.banner{max-width:640px;margin:0 auto 14px;padding:10px 16px;font-size:14px;color:var(--muted)}

input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 13px}
textarea{min-height:84px;resize:vertical}
#sheet{position:fixed;inset:0;background:rgba(37,48,42,.45);display:flex;align-items:flex-start;justify-content:center;z-index:5;padding-top:7vh}
.panel{background:var(--bg);width:calc(100% - 24px);max-width:560px;max-height:84vh;overflow-y:auto;border-radius:18px;padding:20px 16px}
.panel form,.panel .stack{display:flex;flex-direction:column;gap:14px}
.panel h2{font-family:var(--display);font-weight:400;font-size:24px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.said{color:var(--muted);font-size:14px;margin:0}
.reply{font-family:var(--display);font-size:22px;line-height:1.3;margin:0}
.todo{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.todo li{padding:11px 14px;display:flex;flex-direction:column;gap:2px}
.todo li span{color:var(--muted);font-size:14px}
#toast{position:fixed;left:16px;right:16px;bottom:24px;margin:0 auto;max-width:440px;background:var(--ink);color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;font-weight:500;z-index:6;text-align:center}

#welcome{position:fixed;inset:0;z-index:9;background:var(--sage);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;border:0;width:100%}
#welcome .w-hi{font-family:var(--display);font-size:44px;line-height:1.1;margin:0;text-wrap:balance}
#welcome .w-line{width:min(220px,50vw);height:2px;background:#fff;opacity:.7}
#welcome .w-date{margin:0;font-size:15px;opacity:.9}
#welcome.out{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  #welcome{transition:opacity .5s ease}
  #welcome .w-hi{animation:w-up .7s .1s ease-out both}
  #welcome .w-line{animation:w-draw .9s .3s ease-out both}
  #welcome .w-date{animation:w-up .7s .5s ease-out both}
  @keyframes w-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes w-draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  #view.anim .track i{transform-origin:left center;animation:grow-x .9s cubic-bezier(.2,.7,.2,1) both}
  #view.anim .colbar .bar{transform-origin:center bottom;animation:grow-y .8s cubic-bezier(.2,.7,.2,1) both}
  #view.anim .colbar:nth-child(2) .bar{animation-delay:.05s} #view.anim .colbar:nth-child(3) .bar{animation-delay:.1s}
  #view.anim .colbar:nth-child(4) .bar{animation-delay:.15s} #view.anim .colbar:nth-child(5) .bar{animation-delay:.2s}
  #view.anim .colbar:nth-child(6) .bar{animation-delay:.25s} #view.anim .colbar:nth-child(7) .bar{animation-delay:.3s} #view.anim .colbar:nth-child(8) .bar{animation-delay:.35s}
  #view.anim .dotday.done i{animation:pop .5s ease-out both}
  @keyframes grow-x{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes grow-y{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
  .panel{animation:w-up .2s ease-out}
}
@media (min-width:700px){ .figs{grid-template-columns:repeat(4,1fr)} h1{font-size:40px} .slots-grid{grid-template-columns:1fr 1fr} }
@media (min-width:900px){ .col,.top-in,.banner{max-width:960px} .clock{font-size:60px} }
</style>
</head>
<body>
<button id="welcome" aria-label="Open the app"><p class="w-hi" id="w-hi">Hello, Becky</p><span class="w-line"></span><p class="w-date" id="w-date"></p></button>
<header id="top"><div class="top-in">
  <div class="brand"><b id="brand">Becky's Week</b><button class="gear" id="settings-btn">Settings</button></div>
  <form id="ask-form" hidden>
    <input type="text" id="ask-input" placeholder="Tell me what to add" aria-label="Tell the app what to add" autocomplete="off">
    <button class="btn primary" id="ask-send">Send</button>
  </form>
  <nav aria-label="Sections"><ul>
    <li><a href="#today" data-r="today">Today</a></li>
    <li><a href="#family" data-r="family">Family</a></li>
    <li><a href="#bertie" data-r="bertie" id="nav-dog">Bertie</a></li>
    <li><a href="#fitness" data-r="fitness">Fitness</a></li>
    <li><a href="#kitchen" data-r="kitchen">Kitchen</a></li>
    <li><a href="#trips" data-r="trips">Trips</a></li>
    <li><a href="#house" data-r="house">House</a></li>
  </ul></nav>
</div></header>
<main id="view"></main>
<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
'use strict';
var $ = function(s){ return document.querySelector(s); };
var view = $('#view'), sheet = $('#sheet'), toastEl = $('#toast'), askBar = $('#ask-form'), askInput = $('#ask-input'), welcomeEl = $('#welcome');

var ROUTES = ['hub','today','family','bertie','fitness','kitchen','trips','house'];
var DAYS = [['mon','Monday'],['tue','Tuesday'],['wed','Wednesday'],['thu','Thursday'],['fri','Friday'],['sat','Saturday'],['sun','Sunday']];
var DAY_NAMES = DAYS.map(function(d){ return d[1]; });
var DEF = {name:'Becky', goal:4, dog:'Bertie', feeders:'Becky, Jamie, Oscar, Alf, Eve',
  feedAm:'08:00', walkAm:'08:15', feedPm:'16:30', walkPm:'16:45', dinner:'19:30'};
var SLOTS = [
  {id:'feedAm', label:'Breakfast', done:'Fed', btn:'fed him', kind:'Feed'},
  {id:'walkAm', label:'Morning walk', done:'Walked', btn:'walked him', kind:'Walk'},
  {id:'feedPm', label:'Tea', done:'Fed', btn:'fed him', kind:'Feed'},
  {id:'walkPm', label:'Afternoon walk', done:'Walked', btn:'walked him', kind:'Walk'}];
var MOVES = ['Gym','Class','Walk','Run'];

var K = {
  workout:{one:'workout', f:[
    {k:'title',l:'What you did',t:'text',req:1,ph:'Gym, spin class, walk, run'},
    {k:'date',l:'Date',t:'date',today:1},
    {k:'minutes',l:'Minutes',t:'number'},
    {k:'km',l:'Distance (km)',t:'number'},
    {k:'notes',l:'How it felt',t:'textarea'}]},
  shop:{one:'shopping item', f:[{k:'title',l:'Item',t:'text',req:1}]},
  recipe:{one:'recipe', f:[
    {k:'title',l:'Dish',t:'text',req:1},
    {k:'occasion',l:'Best for',t:'select',o:['Weeknight','Dinner party','Sunday lunch','Baking','Drinks and nibbles']},
    {k:'serves',l:'Serves',t:'number'},
    {k:'source',l:'Where the recipe is',t:'text',ph:'Book and page, or a web address'},
    {k:'rating',l:'Rating out of 5',t:'select',o:['','1','2','3','4','5']},
    {k:'notes',l:'Notes',t:'textarea',ph:'Who loved it, what to change next time'}]},
  party:{one:'get-together', f:[
    {k:'title',l:'Occasion',t:'text',req:1,ph:'Sunday lunch, birthday dinner'},
    {k:'date',l:'Date',t:'date'},
    {k:'guests',l:'Who is coming',t:'textarea'},
    {k:'menu',l:'Menu',t:'textarea'},
    {k:'notes',l:'Notes',t:'textarea',ph:'Allergies, what worked last time'}]},
  trip:{one:'trip or day out', f:[
    {k:'title',l:'Where or what',t:'text',req:1},
    {k:'where',l:'Location',t:'text'},
    {k:'date',l:'Date, if booked',t:'date'},
    {k:'status',l:'Status',t:'select',o:['Want to go','Booked','Been']},
    {k:'notes',l:'Notes',t:'textarea'}]},
  event:{one:'calendar entry', f:[
    {k:'title',l:'What is it',t:'text',req:1,ph:'Dentist, football, out for dinner'},
    {k:'who',l:'Who',t:'select',dyn:'family'},
    {k:'date',l:'Date',t:'date',req:1,today:1},
    {k:'time',l:'Starts',t:'time'},
    {k:'back',l:'Back home by',t:'time'},
    {k:'where',l:'Where',t:'text'},
    {k:'notes',l:'Notes',t:'textarea'}]},
  job:{one:'job', f:[
    {k:'title',l:'Job',t:'text',req:1},
    {k:'day',l:'Day',t:'select',o:['Any day'].concat(DAY_NAMES)}]}
};

var items = [], settings = Object.assign({}, DEF), meals = {};
var mode = 'loading', db = null, stale = false, lastRoute = null, shown = null, welcomeUp = true, welcomeTimer = null;
var sample = null, askCtl = null, pending = null, kitchenTab = 'week';
var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var LS = 'becky-week-v1';

/* ---------- helpers ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function isDate(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s)); }
function parse(s){ var p = String(s).split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function today(){ return iso(new Date()); }
function addDays(s, n){ var d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
function daysUntil(s){ return Math.round((parse(s) - parse(today())) / 864e5); }
function weekStart(s){ var d = parse(s); return addDays(s, -((d.getDay() + 6) % 7)); }
function nice(s){ if (!isDate(s)) return ''; var d = parse(s);
  return d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short', year: d.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined}); }
function rel(d){ return d === 0 ? 'today' : d === 1 ? 'tomorrow' : d === -1 ? 'yesterday' : d < 0 ? (-d) + ' days ago' : 'in ' + d + ' days'; }
function num(v){ var n = Number(v); return isFinite(n) ? n : 0; }
function stars(r){ r = Number(r); return r >= 1 && r <= 5 ? '★★★★★'.slice(0, r) + '☆☆☆☆☆'.slice(0, 5 - r) : ''; }
function of(kind){ return items.filter(function(i){ return i.kind === kind; }); }
function byId(id){ return items.filter(function(x){ return x.id === id; })[0] || null; }
function join(a){ return a.filter(function(x){ return x !== '' && x != null; }).join(' · '); }
function sum(list, fn){ return list.reduce(function(n, x){ return n + num(fn(x)); }, 0); }
function todayName(){ return DAY_NAMES[(new Date().getDay() + 6) % 7]; }
var toastTimer;
function toast(msg){ toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.hidden = true; }, 3800); }
function writeErr(e){
  var msg = String((e && (e.message || e.code)) || 'unknown error');
  lastError = msg; render();
  toast('That did not save: ' + msg.slice(0, 140));
}

/* ---------- what the app works out ---------- */
function inWeek(w, start){ return isDate(w.date) && weekStart(w.date) === start; }
function thisWeek(){ var s = weekStart(today()); return of('workout').filter(function(w){ return inWeek(w, s); }); }
function streak(){
  var s = weekStart(today()), all = of('workout'), n = 0;
  if (!all.some(function(w){ return inWeek(w, s); })) s = addDays(s, -7);
  while (all.some(function(w){ return inWeek(w, s); })) { n++; s = addDays(s, -7); }
  return n;
}
function jobDone(j){ return j.doneWeek === weekStart(today()); }
function jobsToday(){ var t = todayName(); return of('job').filter(function(j){ return j.day === t || !j.day || j.day === 'Any day'; }); }

/* ---------- storage: one shared table in Supabase, cached on the device so it opens instantly ---------- */
var sb = null, CFG = window.HUB_CONFIG || {}, live = null, lastError = '';
function lsSave(){ try { localStorage.setItem(LS, JSON.stringify({items:items, settings:settings, meals:meals})); } catch(e){} }
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function applyRow(id, data){
  if (id === 'meta-settings') settings = Object.assign({}, DEF, data || {});
  else if (id === 'meta-meals') meals = Object.assign({}, data || {});
  else { var row = Object.assign({}, data, {id:id}), i = items.findIndex(function(x){ return x.id === id; }); if (i >= 0) items[i] = row; else items.push(row); }
}
function dropRow(id){
  if (id === 'meta-meals') meals = {}; else if (id === 'meta-settings') settings = Object.assign({}, DEF);
  else items = items.filter(function(x){ return x.id !== id; });
}
function put(id, data){
  applyRow(id, data); lsSave(); render();
  if (!sb) return Promise.resolve(true);
  return sb.from('hub_items').upsert({id:id, data:data, updated_at:new Date().toISOString()}).then(function(r){
    if (r.error) { writeErr(r.error); loadAll(); return false; } return true; }, function(e){ writeErr(e); return false; });
}
function del(id){
  dropRow(id); lsSave(); render();
  if (!sb) return Promise.resolve(true);
  return sb.from('hub_items').delete().eq('id', id).then(function(r){
    if (r.error) { writeErr(r.error); loadAll(); return false; } return true; }, function(e){ writeErr(e); return false; });
}
function saveItem(it){
  var id = it.id || newId(), body = Object.assign({}, it); delete body.id;
  if (!body.at) body.at = Date.now();
  return put(id, body);
}
function removeItem(id){ return del(id); }
function removeMany(list){ return list.reduce(function(p, it){ return p.then(function(){ return removeItem(it.id); }); }, Promise.resolve()); }
function saveMeta(name, data){ return put('meta-' + name, data); }
function loadAll(){
  if (!sb) return Promise.resolve();
  return sb.from('hub_items').select('id,data').then(function(r){
    if (r.error) { lastError = r.error.message || String(r.error.code || 'unknown error'); if (mode !== 'shared') mode = 'lost'; stale = true; render(); return; }
    items = []; settings = Object.assign({}, DEF); meals = {};
    (r.data || []).forEach(function(x){ applyRow(x.id, x.data); });
    mode = 'shared'; stale = false; lastError = ''; lsSave(); render();
  }, function(e){ lastError = String((e && e.message) || 'no connection'); stale = true; render(); });
}
function startLive(){
  if (live) return;
  live = sb.channel('hub').on('postgres_changes', {event:'*', schema:'public', table:'hub_items'}, function(p){
    if (p.eventType === 'DELETE') { if (p.old && p.old.id) dropRow(p.old.id); }
    else if (p.new && p.new.id) applyRow(p.new.id, p.new.data);
    lsSave(); render();
  }).subscribe();
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) loadAll(); });
  window.addEventListener('online', loadAll);
  setInterval(loadAll, 5 * 60000);
}
function boot(){
  try { var c = JSON.parse(localStorage.getItem(LS)) || {}; items = c.items || []; settings = Object.assign({}, DEF, c.settings || {}); meals = c.meals || {}; } catch(e){}
  if (!CFG.url || !CFG.key) { mode = 'setup'; render(); return; }
  if (!window.supabase) { mode = items.length ? 'shared' : 'lost'; stale = true; render(); return; }
  sb = window.supabase.createClient(CFG.url, CFG.key, {auth:{persistSession:true, autoRefreshToken:true}});
  sb.auth.getSession().then(function(r){
    if (r.data && r.data.session) { mode = items.length ? 'shared' : 'loading'; render(); loadAll(); startLive(); }
    else { mode = 'login'; render(); }
  });
}
function loginView(){
  return '<div class="col"><header><p class="eyebrow">Bartle Home</p><h1>Sign in</h1></header>' +
    '<form class="card pad sec" id="login-form"><p class="note">Sign in once with the family login. This device then stays signed in.</p>' +
    '<div class="field"><label for="lg-email">Email</label><input type="email" id="lg-email" autocomplete="username" required></div>' +
    '<div class="field"><label for="lg-pass">Password</label><input type="password" id="lg-pass" autocomplete="current-password" required></div>' +
    '<p class="note" id="lg-msg" role="alert"></p><button class="btn primary">Sign in</button></form></div>';
}
function setupView(){
  return '<div class="col"><header><p class="eyebrow">Bartle Home</p><h1>Almost ready</h1></header><div class="card pad"><p class="note">The database is not connected yet. Oscar needs to add the Supabase details to config.js.</p></div></div>';
}

/* ---------- pieces ---------- */
function fig(v, l, warm){ return '<div class="fig card' + (warm ? ' warm' : '') + '"><b>' + esc(v) + '</b><span>' + esc(l) + '</span></div>'; }
function row(it, title, subline, side){
  return '<div class="row"><button class="row-main" data-act="edit" data-id="' + esc(it.id) + '"><span class="row-title">' + esc(title) + '</span>' +
    (subline ? '<span class="row-sub">' + esc(subline) + '</span>' : '') + '</button>' + (side ? '<div class="row-side">' + side + '</div>' : '') + '</div>';
}
function pill(c, t){ return '<span class="pill ' + c + '">' + esc(t) + '</span>'; }
function listBox(rows, emptyText){ return '<div class="list card">' + (rows.length ? rows.join('') : '<div class="empty">' + esc(emptyText) + '</div>') + '</div>'; }
function weekDots(){
  var s = weekStart(today()), done = thisWeek().map(function(w){ return w.date; });
  return '<div class="dots">' + DAYS.map(function(d, i){ var day = addDays(s, i);
    return '<div class="dotday' + (done.indexOf(day) >= 0 ? ' done' : '') + (day === today() ? ' today' : '') + '"><i></i>' + d[1].slice(0, 3) + '</div>'; }).join('') + '</div>';
}
function moveButtons(){ return '<div class="quick-row">' + MOVES.map(function(m){ return '<button class="chip" data-act="move" data-move="' + m + '">' + m + '</button>'; }).join('') + '</div>'; }
function jobTick(j){
  var d = jobDone(j);
  return '<div class="tick' + (d ? ' done' : '') + '"><label for="job-' + esc(j.id) + '"><input type="checkbox" id="job-' + esc(j.id) + '" data-act="tick-job" data-id="' + esc(j.id) + '"' + (d ? ' checked' : '') + '><span>' + esc(j.title) + '</span></label>' +
    '<button class="x" data-act="edit" data-id="' + esc(j.id) + '" aria-label="Edit ' + esc(j.title) + '">Edit</button></div>';
}
function banner(){
  var out = '';
  if (mode === 'lost') out += '<div class="banner card">Can\'t reach the hub right now. Showing what was saved on this device. Check the Wi-Fi.</div>';
  if (lastError) out += '<div class="banner card" role="alert">Not syncing with the other devices. Reason: ' + esc(lastError.slice(0, 160)) + '</div>';
  else if (stale) out += '<div class="banner card">Not updated for a while. What you see may be out of date.</div>';
  return out;
}

function dogName(){ return settings.dog || DEF.dog; }
function family(){ return String(settings.feeders || DEF.feeders).split(',').map(function(x){ return x.trim(); }).filter(Boolean).slice(0, 8); }
function slotTime(sl){ var t = settings[sl.id] || DEF[sl.id]; return /^\d{2}:\d{2}$/.test(t) ? t : DEF[sl.id]; }
function mins(t){ var p = t.split(':').map(Number); return p[0] * 60 + p[1]; }
function nowMins(){ var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function hhmm(){ var d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function slotRecId(sl){ return 'bertie-' + today() + '-' + sl.id; }
function slotState(sl){
  var rec = byId(slotRecId(sl)), diff = nowMins() - mins(slotTime(sl));
  if (rec) return {rec:rec, c:'done'};
  if (diff >= 60) return {c:'late', t:'Not done yet'};
  if (diff >= -15) return {c:'due', t:'Due now'};
  return {c:'later', t:'At ' + slotTime(sl)};
}
function nextSlot(){ return SLOTS.filter(function(sl){ return !byId(slotRecId(sl)); })[0] || null; }
function slotBody(sl, st){
  if (st.rec) return '<div class="names">' + pill('sage', st.rec.done + ' by ' + st.rec.by + ' at ' + st.rec.time) +
    '<button class="x" data-act="undo-dog" data-id="' + esc(st.rec.id) + '">Undo</button></div>';
  return '<div class="names">' + family().map(function(p){ return '<button class="chip" data-act="dog" data-slot="' + sl.id + '" data-by="' + esc(p) + '">' + esc(p) + '</button>'; }).join('') + '</div>';
}
function slotHead(sl, st){
  return '<div class="slot-head"><b><span class="t">' + esc(slotTime(sl)) + '</span>' + esc(sl.label) + '</b>' +
    (st.rec ? '' : pill(st.c === 'late' ? 'late' : st.c === 'due' ? 'peach' : '', st.t)) + '</div>';
}
/* Today page: the four times at a glance, with name buttons on the one that is due. */
function dogCard(){
  var nx = nextSlot();
  return '<section class="card pad sec"><div class="sec-head"><h2>' + esc(dogName()) + ' today</h2><a class="link" href="#bertie">Open</a></div><div>' +
    SLOTS.map(function(sl){ var st = slotState(sl), show = !st.rec && nx && nx.id === sl.id && st.c !== 'later';
      return '<div class="slot">' + slotHead(sl, st) + (st.rec ? slotBody(sl, st) : show ? slotBody(sl, st) : '') + '</div>'; }).join('') +
    '</div></section>';
}
function weekTally(){
  var s = weekStart(today()), counts = {};
  family().forEach(function(p){ counts[p] = {Feed:0, Walk:0}; });
  of('bertie').forEach(function(r){ if (isDate(r.date) && weekStart(r.date) === s && counts[r.by]) counts[r.by][r.type === 'Walk' ? 'Walk' : 'Feed']++; });
  var names = Object.keys(counts), max = Math.max(1, Math.max.apply(null, names.map(function(n){ return counts[n].Feed + counts[n].Walk; })));
  return '<div class="cols">' + names.map(function(n){ var c = counts[n], t = c.Feed + c.Walk;
    return '<div class="colbar"><b>' + (t || '') + '</b><div class="bar' + (t ? ' hit' : '') + '" style="height:calc((100% - 40px) * ' + (t / max).toFixed(3) + ')"></div><em>' + esc(n) + '</em></div>'; }).join('') + '</div>' +
    '<p class="note">Feeds and walks logged since Monday.</p>';
}
function kitchen(){ try { return localStorage.getItem(LS + '-kitchen') === 'on'; } catch(e){ return false; } }
function kitchenPin(){ try { return localStorage.getItem(LS + '-pin') || ''; } catch(e){ return ''; } }
function slotCards(){
  return '<div class="slots-grid">' + SLOTS.map(function(sl){ var st = slotState(sl);
    return '<section class="card slot-card' + (st.rec ? ' is-done' : (st.c === 'due' || st.c === 'late') ? ' is-due' : '') + '">' + slotHead(sl, st) + slotBody(sl, st) + '</section>'; }).join('') + '</div>';
}
function shopBlock(){
  var shop = of('shop').slice().sort(function(a, b){ return (a.done ? 1 : 0) - (b.done ? 1 : 0) || (a.at || 0) - (b.at || 0); });
  var ticked = shop.filter(function(x){ return x.done; }).length;
  return '<section class="sec"><h2>Shopping list</h2><form class="quick" id="quick-shop"><input type="text" id="shop-new" placeholder="Add an item" aria-label="Add an item" autocomplete="off"><button class="btn primary">Add</button></form>' +
    '<div class="list card">' + (shop.length ? shop.map(function(x){
      return '<div class="tick' + (x.done ? ' done' : '') + '"><label for="chk-' + esc(x.id) + '"><input type="checkbox" id="chk-' + esc(x.id) + '" data-act="tick-shop" data-id="' + esc(x.id) + '"' + (x.done ? ' checked' : '') + '><span>' + esc(x.title) + '</span></label>' +
        '<button class="x" data-act="remove" data-id="' + esc(x.id) + '" aria-label="Remove ' + esc(x.title) + '">Remove</button></div>'; }).join('') : '<div class="empty">The list is empty.</div>') + '</div>' +
    (ticked ? '<button class="link" data-act="clear-ticked">Clear ' + ticked + ' ticked</button>' : '') + '</section>';
}
function mealsBlock(){
  var dk = DAYS[(new Date().getDay() + 6) % 7][0];
  return '<section class="card pad sec"><div class="sec-head"><h2>Dinners this week</h2><button class="link" data-act="clear-meals">Clear week</button></div>' +
    DAYS.map(function(d){ return '<div class="meal' + (d[0] === dk ? ' today' : '') + '"><label for="meal-' + d[0] + '">' + d[1] + '</label>' +
      '<input type="text" id="meal-' + d[0] + '" data-meal="' + d[0] + '" value="' + esc(meals[d[0]] || '') + '" placeholder="' + (d[0] === dk ? 'Tonight' : '') + '" autocomplete="off"></div>'; }).join('') + '</section>';
}
function slug(n){ return String(n).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'x'; }
function statusOf(name){ var r = byId('status-' + slug(name)); return r && r.date === today() ? r : null; }
function upcoming(days){
  return of('event').filter(function(e){ return isDate(e.date) && daysUntil(e.date) >= 0 && daysUntil(e.date) < days; })
    .sort(function(a, b){ return (a.date + (a.time || '99')).localeCompare(b.date + (b.time || '99')); });
}
function personCard(name){
  var st = statusOf(name), out = st && st.state === 'Out', evs = upcoming(1).filter(function(e){ return e.who === name; });
  var line = out ? join([st.where ? 'At ' + st.where : 'Out', st.back ? 'back about ' + st.back : '']) : st ? 'At home' : 'Not updated today';
  var dinner = st && st.dinner === 'No' ? pill('late', 'Not in for dinner') : st ? pill('sage', 'In for dinner') : '';
  return '<section class="card person ' + (out ? 'out' : st ? 'home' : '') + '"><div class="person-top"><b>' + esc(name) + '</b>' + dinner + '</div>' +
    '<p class="sub">' + esc(line) + (evs.length ? ' · Today: ' + esc(evs.map(function(e){ return (e.time ? e.time + ' ' : '') + e.title; }).join(', ')) : '') + '</p>' +
    '<div class="names"><button class="chip" data-act="st-home" data-name="' + esc(name) + '">I\'m home</button><button class="chip" data-act="st-out" data-name="' + esc(name) + '">I\'m out</button></div></section>';
}
function whereBlock(){
  var fam = family(), notIn = fam.filter(function(n){ var st = statusOf(n); return st && st.dinner === 'No'; });
  var dinnerT = /^\d{2}:\d{2}$/.test(settings.dinner || '') ? settings.dinner : DEF.dinner;
  return '<section class="sec"><div class="sec-head"><h2>Who\'s where</h2><span class="note">' + (fam.length - notIn.length) + ' of ' + fam.length + ' in for dinner at ' + esc(dinnerT) +
    (notIn.length ? ' (not ' + esc(notIn.join(', ')) + ')' : '') + '</span></div><div class="people">' + fam.map(personCard).join('') + '</div></section>';
}
function calendarBlock(days){
  var list = upcoming(days), out = '', d;
  for (d = 0; d < days; d++) {
    var day = addDays(today(), d), evs = list.filter(function(e){ return e.date === day; });
    if (!evs.length && d > 0) continue;
    out += '<p class="day-h' + (d === 0 ? ' is-today' : '') + '">' + (d === 0 ? 'Today' : d === 1 ? 'Tomorrow' : esc(parse(day).toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'short'}))) + '</p>' +
      '<div class="list card">' + (evs.length ? evs.map(function(e){
        return '<div class="row"><button class="row-main" data-act="edit" data-id="' + esc(e.id) + '"><span class="row-title">' + (e.time ? '<span class="ev-time">' + esc(e.time) + '</span>' : '') + esc(e.title) + '</span>' +
          '<span class="row-sub">' + esc(join([e.who && e.who !== 'Everyone' ? e.who : 'Everyone', e.where, e.back ? 'back by ' + e.back : '', e.notes])) + '</span></button></div>'; }).join('')
        : '<div class="empty">Nothing on today.</div>') + '</div>';
  }
  return '<section class="sec"><div class="sec-head"><h2>Family calendar</h2><span class="note">Next ' + days + ' days</span></div>' + out +
    '<button class="btn primary add" data-act="add" data-kind="event">Add to the calendar</button></section>';
}
function statusSheet(name){

/* ---------- views ---------- */

V.hub = function(){
  var now = new Date(), dk = DAYS[(now.getDay() + 6) % 7][0], nx = nextSlot();
  var dinnerT = /^\d{2}:\d{2}$/.test(settings.dinner || '') ? settings.dinner : DEF.dinner;
  return '<div class="col big hub"><div class="dog-hero"><div><p class="eyebrow">' + esc(now.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'})) + '</p>' +
      '<h1>Kitchen</h1><p class="next">' + (nx ? esc(dogName()) + ' next: ' + esc(nx.label.toLowerCase()) + ' at ' + esc(slotTime(nx)) : esc(dogName()) + ' is all sorted for today.') + '</p></div>' +

  sheet.innerHTML = '<div class="panel" role="dialog" aria-modal="true" aria-labelledby="sh-title"><div class="stack"><p class="said" id="sh-title">You said: "' + esc(said) + '"</p>' + inner + '</div></div>';
  sheet.hidden = false;
}
function ask(said){
  if (!sample) return;
  if (askCtl) askCtl.abort();
  var ctl = askCtl = new AbortController();
  askSheet(said, '<p class="reply">Thinking</p><div class="actions"><span class="grow"></span><button class="btn ghost" data-act="close">Cancel</button></div>');
  sample.json(promptFor(said), {cache:false, signal:ctl.signal, modelTier:'quick'}).then(function(res){
    if (askCtl !== ctl) return; askCtl = null;
    var reply = res && typeof res.reply === 'string' ? res.reply.slice(0, 500) : '', acts = [];
    (res && Array.isArray(res.actions) ? res.actions : []).slice(0, 20).forEach(function(a){
      if (!a || typeof a !== 'object') return;
      if (a.do === 'meal') { if (DAYS.some(function(d){ return d[0] === a.day; }) && typeof a.text === 'string' && a.text.trim()) acts.push({meal:a.day, text:a.text.trim().slice(0, 200)}); }
      else if (a.do === 'update') { var old = byId(String(a.id)); if (!old || !K[old.kind]) return;
        var f = clean(old.kind, a.fields); if (Object.keys(f).length) acts.push({kind:old.kind, old:old, fields:f}); }
      else if (a.do === 'add' && K[a.kind]) { var g = clean(a.kind, a.fields); if (g.title) acts.push({kind:a.kind, old:null, fields:g}); }
    });
    if (!acts.length) { askSheet(said, '<p class="reply">' + esc(reply || 'I did not find anything to add in that. Try saying it another way.') + '</p><div class="actions"><span class="grow"></span><button class="btn primary" data-act="close">Done</button></div>'); return; }
    pending = {said:said, reply:reply, acts:acts};
    askSheet(said, '<h2>Shall I add this?</h2><ul class="todo">' + acts.map(function(a){ var d = describe(a);
      return '<li class="card"><b>' + esc(d.t) + '</b>' + (d.s ? '<span>' + esc(d.s) + '</span>' : '') + '</li>'; }).join('') + '</ul>' +
      '<div class="actions"><span class="grow"></span><button class="btn ghost" data-act="close">No, cancel</button><button class="btn primary" data-act="confirm">Yes, add it</button></div>');
  }).catch(function(e){
    if (askCtl === ctl) askCtl = null;
    var c = e && e.code; if (c === 'cancelled') return;
    if (c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared' || c === 'capability_disabled' || c === 'capability_removed') askBar.hidden = true;
    askSheet(said, '<p class="reply">' + (askBar.hidden ? 'The helper is switched off for this app. You can still add everything by hand.'
      : c === 'rate_limited' ? 'The helper is busy. Give it a minute and try again.' : c === 'session_expired' ? 'Sign in to Claude again, then try once more.'
      : 'I did not catch that properly. Try saying it again, a little more plainly.') + '</p><div class="actions"><span class="grow"></span><button class="btn primary" data-act="close">Close</button></div>');
  });
}
function applyPending(){
  if (!pending) return;
  var p = pending; pending = null;
  var btn = sheet.querySelector('[data-act="confirm"]'); if (btn) btn.disabled = true;
  var nextMeals = Object.assign({}, meals), mealChanged = false;
  p.acts.forEach(function(a){ if (a.meal) { nextMeals[a.meal] = a.text; mealChanged = true; } });
  p.acts.filter(function(a){ return !a.meal; }).reduce(function(chain, a){ return chain.then(function(ok){
    if (!ok) return false;
    var it = a.old ? Object.assign({}, a.old, a.fields) : Object.assign({kind:a.kind}, a.fields);
    if (a.kind === 'workout' && !it.date) it.date = today();
    return saveItem(it);
  }); }, Promise.resolve(true)).then(function(ok){ return ok && mealChanged ? saveMeta('meals', nextMeals) : ok; }).then(function(ok){
    if (!ok) { closeSheet(); return; }
    askSheet(p.said, '<p class="reply">' + esc(p.reply || 'Added.') + '</p><div class="actions"><span class="grow"></span><button class="btn primary" data-act="close">Done</button></div>');
  });
}
askBar.addEventListener('submit', function(ev){
  ev.preventDefault();
  var said = askInput.value.trim().slice(0, 1000); if (!said) return;
  askInput.value = ''; ask(said);
});
$('#settings-btn').addEventListener('click', function(){ openSheet('_settings'); });

/* ---------- actions on the page ---------- */
view.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT') return;
  var act = b.dataset.act, id = b.dataset.id;
  if (act === 'add') openSheet(b.dataset.kind);
  else if (act === 'edit') openSheet(null, id);
  else if (act === 'move') openSheet('workout', null, {title:b.dataset.move});
  else if (act === 'dog') { var sl = SLOTS.filter(function(x){ return x.id === b.dataset.slot; })[0]; if (!sl) return;
    saveItem({id: slotRecId(sl), kind:'bertie', date: today(), slot: sl.id, type: sl.kind, done: sl.done, by: b.dataset.by, time: hhmm()}).then(function(ok){
      if (!ok) return;
      toast(sl.done + ' by ' + b.dataset.by + '. Thank you.');
      removeMany(of('bertie').concat(of('feed')).filter(function(f){ return isDate(f.date) && daysUntil(f.date) < -14; })); }); }
  else if (act === 'undo-dog' && id) removeItem(id);
  else if (act === 'st-out') statusSheet(b.dataset.name);
  else if (act === 'st-home') { var nm = b.dataset.name, prev = statusOf(nm);
    saveStatus(nm, {state:'Home', dinner: prev && prev.dinner === 'No' ? 'No' : 'Yes'}).then(function(ok){ if (ok) toast(nm + ' is home.'); }); }
  else if (act === 'kiosk-on') pinSheet('set');
  else if (act === 'kiosk-off') pinSheet('check');
  else if (act === 'set-start') { try { if (startPage() === 'bertie') localStorage.removeItem(LS + '-start'); else localStorage.setItem(LS + '-start', 'bertie'); } catch(e){}
    toast(startPage() === 'bertie' ? 'This device will now open on ' + dogName() + "'s page." : 'This device will now open on Today.'); render(); }
  else if (act === 'ktab') { kitchenTab = b.dataset.tab; render(); }
  else if (act === 'remove' && id) removeItem(id);
  else if (act === 'clear-ticked') removeMany(of('shop').filter(function(s){ return s.done; }));
  else if (act === 'clear-meals') saveMeta('meals', {});
});
view.addEventListener('change', function(ev){
  var el = ev.target, it = el.dataset.id ? byId(el.dataset.id) : null;
  if (el.dataset.act === 'tick-shop' && it) saveItem(Object.assign({}, it, {done: el.checked}));
  if (el.dataset.act === 'tick-job' && it) { var j = Object.assign({}, it); if (el.checked) j.doneWeek = weekStart(today()); else delete j.doneWeek; saveItem(j); }
  if (el.dataset.meal) { var next = Object.assign({}, meals), v = el.value.trim().slice(0, 200);
    if (v) next[el.dataset.meal] = v; else delete next[el.dataset.meal];
    if ((meals[el.dataset.meal] || '') !== v) saveMeta('meals', next); }
});
view.addEventListener('submit', function(ev){
  if (ev.target.id !== 'login-form') return;
  ev.preventDefault(); ev.stopImmediatePropagation();
  var msg = $('#lg-msg'), btn = ev.target.querySelector('button'); btn.disabled = true; msg.textContent = 'Signing in';
  sb.auth.signInWithPassword({email: $('#lg-email').value.trim(), password: $('#lg-pass').value}).then(function(r){
    btn.disabled = false;
    if (r.error) { msg.textContent = 'That email and password did not work. Check them and try again.'; return; }
    msg.textContent = ''; mode = items.length ? 'shared' : 'loading'; render(); loadAll(); startLive();
  });
}, true);
view.addEventListener('submit', function(ev){
  ev.preventDefault();
  if (ev.target.id !== 'quick-shop') return;
  var input = document.getElementById('shop-new'), v = input.value.trim().slice(0, 200); if (!v) return;
  input.value = '';
  saveItem({kind:'shop', title:v, done:false});
});
window.addEventListener('hashchange', render);
/* Keep the screen current when it is left open in the kitchen: times, due flags and the new day. */
var lastDay = today();
setInterval(function(){
  var a = document.activeElement, typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT');
  if (!sheet.hidden || typing || welcomeUp) return;
  var r = route();
  if (r === 'hub' || r === 'family' || r === 'bertie' || r === 'today' || today() !== lastDay) { lastDay = today(); render(); }
}, 30000);
setInterval(function(){ var c = document.getElementById('hub-clock') || view.querySelector('.clock'); if (c) c.textContent = hhmm(); }, 5000);
boot();
})();
</script>
</body>
